name: White Horizon cross-platform
on:
  workflow_dispatch:
  push:
    paths: ['src/yacht/**', 'tools/yacht/**', 'build.gradle', '.github/workflows/yacht.yml']
  pull_request:
    paths: ['src/yacht/**', 'tools/yacht/**', 'build.gradle', '.github/workflows/yacht.yml']
permissions:
  contents: read
jobs:
  native-and-server-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-gnu, library: libsable_rapier.so}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu, library: libsable_rapier.so}
          - {os: windows-2022, platform: windows-x64, target: x86_64-pc-windows-msvc, library: sable_rapier.dll}
          - {os: windows-11-arm, platform: windows-arm64, target: aarch64-pc-windows-msvc, library: sable_rapier.dll}
          - {os: macos-15-intel, platform: macos-x64, target: x86_64-apple-darwin, library: libsable_rapier.dylib}
          - {os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin, library: libsable_rapier.dylib}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '21', distribution: temurin}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Java dependencies and verify baseline
        run: ./gradlew verifyProject
      - name: Install pinned Rust target
        run: rustup toolchain install 1.90.0 --profile minimal --target '${{ matrix.target }}'
      - name: Install portable Linux linker
        if: startsWith(matrix.platform, 'linux')
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.14.1
      - name: Build exact native patch
        run: python tools/yacht/build_sable_f64.py --platform '${{ matrix.platform }}' ${{ startsWith(matrix.platform, 'linux') && '--cross' || '' }}
      - name: Package matching native
        run: |
          python tools/yacht/fetch_sable.py
          python tools/yacht/package_sable_f64.py --native '${{ matrix.platform }}=build/yacht/sable-f64-source/sable_rapier/src/main/rust/target/${{ matrix.target }}/release/${{ matrix.library }}'
      - name: Exercise native in Minecraft dedicated-server tests
        run: |
          ./gradlew verifyProject -PyachtPrototype -PyachtF64
          cp build/yacht/game-tests/logs/latest.log build/yacht/prototype-verification.log
          ./gradlew verifyProject -Pyacht
      - name: Two real clients, network latency, and reconnect
        if: matrix.platform == 'linux-x64'
        run: |
          ./gradlew prepareYachtMultiplayerReview -Pyacht --no-configuration-cache
          xvfb-run -a python tools/yacht/review_multiplayer.py --timeout 600
      - uses: actions/upload-artifact@v4
        with:
          name: yacht-native-${{ matrix.platform }}
          path: build/yacht/sable-f64-source/sable_rapier/src/main/rust/target/${{ matrix.target }}/release/${{ matrix.library }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yacht-tests-${{ matrix.platform }}
          path: |
            build/yacht/game-tests/logs/latest.log
            build/yacht/prototype-verification.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'linux-x64'
        with:
          name: yacht-multiplayer-review
          path: output/yacht/multiplayer/
  package:
    needs: native-and-server-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '21', distribution: temurin}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'yacht-native-*', path: build/yacht/natives}
      - run: ./gradlew classes
      - run: |
          python3 tools/yacht/fetch_sable.py
          python3 tools/yacht/package_sable_f64.py --require-all \
            --native linux-x64=build/yacht/natives/yacht-native-linux-x64/libsable_rapier.so \
            --native linux-arm64=build/yacht/natives/yacht-native-linux-arm64/libsable_rapier.so \
            --native windows-x64=build/yacht/natives/yacht-native-windows-x64/sable_rapier.dll \
            --native windows-arm64=build/yacht/natives/yacht-native-windows-arm64/sable_rapier.dll \
            --native macos-x64=build/yacht/natives/yacht-native-macos-x64/libsable_rapier.dylib \
            --native macos-arm64=build/yacht/natives/yacht-native-macos-arm64/libsable_rapier.dylib
          ./gradlew verifyProject yachtDistribution -Pyacht
      - uses: actions/upload-artifact@v4
        with: {name: white-horizon-distribution, path: build/distributions/*yacht*.zip}
